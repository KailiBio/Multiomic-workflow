# All paths below are relative to the ATAC_QC/ directory (this module's repo root).
# Both notebooks/ATAC_QC_demo.ipynb and notebooks/run_atac_qc_workflow.sh cd into
# ATAC_QC/ before invoking any script, so relative paths resolve the same way for
# everyone. When adapting this config for your own data, replace these with your
# own paths (relative to ATAC_QC/, or absolute).
paths:
  workdir: test_output/
  fragment_dir: test_data/fragmemt_files/
  output_h5ad_dir: test_output/atac_h5ad/
  sample_metadata: test_data/test_metatable.txt

references:
  barcode_whitelist: ref/10XMultiOmic_737K_arc-v1.txt
  # Reference GTF, too large to ship in this repo (see .gitignore) — download
  # the matching GENCODE annotation yourself and place it at this path.
  gencode_gtf: ref/gencode.v47.primary_assembly.annotation.gtf

params:
  tissue: Muscle - Quadriceps
  suffix: Muscle_Quadriceps
  n_threads: 16
  min_fragments: 100
  genomic_bin_size: 500

qc:
    atac_qc_cutoff_table: test_data/test_QC_cutoffs.xlsx
    sheet_name: test

process:
    n_features: 250000

color:
    tissue_colors: 
        "Kidney": "#a32015"
        "Liver - Left Lobe": "#AABB66"
        "Lung - Left Cranial Lobe": "#99FF00"
        "Muscle - Gastrocnemius": "#9191ff"
        "Muscle - Quadriceps": "#5e5eff"
        "Thyroid": "#006600"
        "Adrenal Gland": "#33DD33"
        "Adipose - Subcutaneous": "#1d8c46"
    donor_colors:
        DGTEX002: "#E73A2F"
        DGTEX031: "#65c4ff"
        DGTEX008: "#FBB30B"
        DGTEX047: "#2E9E49"
        DGTEX001: "#397AF2"
        DGTEX027: "#8e02da"

my_color_palette:
  - "#c50909"
  - "#ffa806"
  - "#fbe95d"
  - "#16b900"
