# All paths below are relative to the multiome_integration/ directory (this
# module's repo root); notebooks/multiome_integration_demo.ipynb and
# notebooks/run_multiome_integration_workflow.sh cd into multiome_integration/
# before invoking any script, so relative paths resolve the same way for
# everyone. Paths starting with ../ reach into a sibling module's directory
# (this module consumes RNA_QC, ATAC_QC, and cell_annotation output). When
# adapting this config for your own data, replace these with your own paths
# (relative to multiome_integration/, or absolute).
paths:
  workdir: test_output/
  rna_post_qc_h5ad: ../cell_annotation/test_output/final/Muscle_Quadriceps.GEX.final.h5ad
  atac_post_qc_h5ad: ../ATAC_QC/test_output/atac_h5ad/Muscle_Quadriceps.ATAC.demo_run.h5ad
  rna_doublet_dir: ../RNA_QC/test_output/filter_qc.demo_run/
  atac_doublet_dir: ../ATAC_QC/test_output/doublet_filter_processing.demo_run/
  output_h5ad_dir: test_output/h5ad/
  sample_metadata: ../ATAC_QC/test_data/test_metatable.txt

references:
  # Reference GTF, too large to ship in this repo (see .gitignore) — same
  # GENCODE annotation used by ATAC_QC (see ATAC_QC/ref/).
  gencode_gtf: ../ATAC_QC/ref/gencode.v47.primary_assembly.annotation.gtf
  # Not provided in this repo: a <chrom><TAB><length> file for your reference
  # genome (e.g. download hg38.chrom.sizes from the UCSC goldenPath). Replace
  # with the path to your own copy.
  chrom_size: /path/to/your/hg38.chrom.sizes

params:
  tissue: Muscle - Quadriceps
  suffix: Muscle_Quadriceps
  n_threads: 16
  n_features: 50000
  peak_half_width: 150
  celllineage_obs: cell_lineage
  celltype_obs: celltype_broad
  imputation: True

color:
    tissue_colors: 
        "Kidney": "#a32015"
        "Liver - Left Lobe": "#AABB66"
        "Lung - Left Cranial Lobe": "#99FF00"
        "Muscle - Gastrocnemius": "#9191ff"
        "Muscle - Quadriceps": "#5e5eff"
        "Thyroid": "#006600"
        "Adrenal Gland": "#33DD33"
        "Adipose - Subcutaneous": "#1d8c46"
    donor_colors:
        DGTEX002: "#E73A2F"
        DGTEX031: "#65c4ff"
        DGTEX008: "#FBB30B"
        DGTEX047: "#2E9E49"
        DGTEX001: "#397AF2"
        DGTEX027: "#8e02da"

