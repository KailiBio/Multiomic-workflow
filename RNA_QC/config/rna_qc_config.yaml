# All paths below are relative to the RNA_QC/ directory (this module's repo root).
# Both notebooks/RNA_QC_demo.ipynb and notebooks/run_rna_qc_workflow.sh cd into
# RNA_QC/ before invoking any script, so relative paths resolve the same way for
# everyone. When adapting this config for your own data, replace these with your
# own paths (relative to RNA_QC/, or absolute).
paths:
  workdir: test_output/
  input_dir: test_data/cellranger/
  scrinvex_dir: test_data/scrinvex/
  output_h5ad_dir: test_output/rna_h5ad/
  sample_metadata: test_data/test_metatable.txt

params:
  tissue: Muscle - Quadriceps
  suffix: Muscle_Quadriceps

qc:
    rna_qc_cutoff_table: test_data/test_QC_cutoffs.xlsx
    sheet_name: test

color:
    tissue_colors: 
        "Kidney": "#a32015"
        "Liver - Left Lobe": "#AABB66"
        "Lung - Left Cranial Lobe": "#99FF00"
        "Muscle - Gastrocnemius": "#9191ff"
        "Muscle - Quadriceps": "#5e5eff"
        "Thyroid": "#006600"
        "Adrenal Gland": "#33DD33"
        "Adipose - Subcutaneous": "#1d8c46"
    donor_colors:
        DGTEX002: "#E73A2F"
        DGTEX031: "#65c4ff"
        DGTEX008: "#FBB30B"
        DGTEX047: "#2E9E49"
        DGTEX001: "#397AF2"
        DGTEX027: "#8e02da"

